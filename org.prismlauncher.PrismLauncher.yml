id: org.prismlauncher.PrismLauncher
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: prismlauncher-wrapper
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

cleanup:
  - /lib
  - /share/tomlplusplus
  - /share/qlogging-categories6
  - /share/man
  - /share/PrismLauncher
  - /include

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --device=input
  - --device-if=all:!has-input-device
  - --socket=pulseaudio
    # for Discord RPC mods
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
    # Mod drag&drop
  - --filesystem=xdg-download:ro
    # FTBApp import
  - --filesystem=~/.ftba:ro
    # Userspace visibility for manual hugepages configuration
    # Required for -XX:+UseLargePages
  - --filesystem=/sys/kernel/mm/hugepages:ro
    # Userspace visibility for transparent hugepages configuration
    # Required for -XX:+UseTransparentHugePages
  - --filesystem=/sys/kernel/mm/transparent_hugepage:ro
  - --env=PATH=/usr/lib/extensions/vulkan/gamescope/bin:/usr/lib/extensions/vulkan/MangoHud/bin:/app/bin:/app/utils/bin:/usr/bin
  - --env=VK_LAYER_PATH=/usr/lib/extensions/vulkan/share/vulkan/implicit_layer.d/

modules:
  - modules/cmark.yml
  # Text to Speech in the game
  - modules/flite.yml
  # Our patches improve native Wayland support
  - modules/glfw.yml
  - modules/tomlplusplus.yml

  - name: prismlauncher
    buildsystem: cmake-ninja
    build-options:
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        JAVA_COMPILER: /usr/lib/sdk/openjdk17/jvm/openjdk-17/bin/javac
    builddir: true
    config-opts:
      - -DLauncher_BUILD_PLATFORM=flatpak
      # This allows us to manage and update Java independently of this Flatpak
      - -DLauncher_ENABLE_JAVA_DOWNLOADER=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    post-install:
      - desktop-file-edit --set-key Exec --set-value prismlauncher-wrapper /app/share/applications/org.prismlauncher.PrismLauncher.desktop
    sources:
      - type: archive
        url: https://github.com/PrismLauncher/PrismLauncher/releases/download/11.1.1/PrismLauncher-11.1.1.tar.gz
        sha256: 9ea53f93714cd2a59dc0f38153690a59a3f06f439934d1410ec364cc7f363eb5
        x-checker-data:
          type: json
          url: https://api.github.com/repos/PrismLauncher/PrismLauncher/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "PrismLauncher-" + $version + ".tar.gz")
            | .browser_download_url

  - name: enhance
    buildsystem: simple
    build-commands:
      - install -Dm755 prismlauncher /app/bin/prismlauncher-wrapper
    sources:
      # Sets up Discord RPC.
      - type: file
        path: scripts/prismlauncher
